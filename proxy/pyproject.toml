[project]
name = "jadelens-proxy"
version = "0.0.0"
description = "JADE LENS secrets proxy — stateless authenticated forwarder."
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

# Runtime deps are mirrored in requirements.txt for the Docker image (so dep
# layers cache independently of source). Keep the two in sync.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
