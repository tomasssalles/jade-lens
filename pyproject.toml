[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jadelens"
dynamic = ["version"]
description = "JADE LENS — personal AI assistant."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tomás Silveira Salles" },
]
dependencies = [
    "jsonpatch>=1.33",
    "markdown-it-py>=3.0",
]

[project.scripts]
jadelens = "jadelens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.version]
path = "jadelens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jadelens"]

[tool.pytest.ini_options]
# "tests" holds the Python-internal suite; "conformance/runners/python" runs
# the cross-client mutation conformance suite (see conformance/README.md).
testpaths = ["tests", "conformance/runners/python"]
